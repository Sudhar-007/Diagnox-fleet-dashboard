services:
  - type: web
    runtime: docker
    name: diagnox-fleet-bff
    rootDir: dashboard/server
    branch: main
    region: singapore
    # Free instances sleep after inactivity; switch to starter before demo day.
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - dashboard/server/**
    envVars:
      # Simulator plus the truck device pushing to POST /api/telemetry.
      - key: DATA_SOURCE
        value: hybrid
      - key: TZ
        value: Asia/Kolkata
      - key: DEMO_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      # Secret the device sends in x-api-key; set it in the Render dashboard, never in git.
      - key: TELEMETRY_API_KEY
        sync: false
      # The hardware board sits still on a bench: its position is generated along a road loop
      # from the speed it reports (see docs/interface.md). Remove when the board is in a truck.
      - key: BENCH_TRUCKS
        value: TN06
